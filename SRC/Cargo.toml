[package]
name = "apkaudio-maclookup"
version = "0.1.0"
edition = "2024"
# The only crate here that talks to the public internet, and it does so under a
# hard budget: macvendors.com allows 1000 requests a day at 1 per second with no
# key. ureq rather than reqwest because every caller is a blocking discovery
# thread — there is no runtime to borrow, and one GET does not justify pulling
# tokio into an agent that captures raw Ethernet.
[dependencies]
apkaudio-contracts = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v0.5" }
ureq = "2.12"

[[bin]]
name = "mac-lookup"
path = "src/bin/mac-lookup.rs"
